all:
  vars:
    ansible_user: ansible
  children:
    control_node:
      hosts:
        LPRANSIBLE01:
          ansible_host: 192.168.10.120
        # portal01 est aussi une VM d'administration (detient le token API
        # Proxmox) : appartient a ce groupe pour le comportement console-only
        # du compte exploitation, meme si elle ne lance pas ansible-playbook.
        portal01:
    portal:
      hosts:
        portal01:
          ansible_host: 192.168.10.121
    webservers:
      hosts:
        # IP DHCP relevee au provisioning (2026-08-14) : peut changer si le
        # bail DHCP n'est pas reserve par MAC cote routeur (BC:24:11:A9:AC:45).
        web01:
          ansible_host: 192.168.10.42
    # Groupes prets pour le portail de provisioning on-demand
    # (CODE-PLATFORME-PROVISIONING-ONDEMDAND). Une VM peut appartenir a
    # plusieurs de ces groupes a la fois (services multiples).
    postgres_servers:
      hosts: {}
    mysql_servers:
      hosts: {}
    wordpress_servers:
      hosts: {}
    nginx_servers:
      hosts: {}
    redis_servers:
      hosts: {}
    docker_servers:
      hosts: {}
    samba_servers:
      hosts: {}
